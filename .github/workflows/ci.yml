name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          install-only: true
      - run: make build vet lint test

  libsql-integration:
    runs-on: ubuntu-latest
    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-libsql
        env:
          TURBINEDB_LIBSQL_URL: http://127.0.0.1:8080

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: turbine
          POSTGRES_PASSWORD: turbine
          POSTGRES_DB: turbine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turbine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-postgres
        env:
          TURBINEDB_POSTGRES_DSN: postgres://turbine:turbine@127.0.0.1:5432/turbine?sslmode=disable
